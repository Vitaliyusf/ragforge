[pytest]
markers =
    compat: behavior kept alive for artifacts/APIs written before a feature existed.
        Fully separable cases live in app/tests/compat/; cases inseparable from
        their module's builders stay in place and carry this marker. Select with
        `-m compat`, exclude from feature work with `-m "not compat"`. When a
        compatibility path is retired, delete the production code and these
        tests together.
