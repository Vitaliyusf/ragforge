name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing in CI writes back to the repository; every job only needs to read it.
permissions:
  contents: read

# The Python interpreter is not pinned here: every job reads the root
# `.python-version` (3.12, matching python:3.12-slim in every service image) so
# CI and local tooling share one source of truth.
env:
  NODE_VERSION: '24'       # matches node:24-alpine in the frontend image

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: ruff
        run: ruff check backend/

  typecheck:
    # Split from `lint` so a Ruff failure never hides the type-check result.
    name: Type-check (mypy strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install tooling and gateway deps
        # mypy resolves gateway imports, so its runtime deps must be present.
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt \
                      -r docker/requirements-base.txt \
                      -r backend/gateway/requirements.txt
      - name: mypy (strict)
        run: mypy backend/shared backend/gateway/app --config-file mypy.ini

  backend:
    name: "Tests: ${{ matrix.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [embedding, files, gateway, llm_agent, memory, rag, vector_db]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install CPU-only torch
        # llm_agent pins torch and embedding pulls it through
        # sentence-transformers. The default wheel carries the full CUDA
        # runtime (~2 GB); the CPU build satisfies `torch==2.13.0` and is a
        # fraction of the size. Nothing under test needs a GPU, and installing
        # it first means the service layer resolves against it.
        if: matrix.service == 'llm_agent' || matrix.service == 'embedding' || matrix.service == 'rag'
        run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        # Three deterministic layers: base runtime, service runtime, canonical
        # test toolchain. No service pins a test runner any more, so the test
        # layer always wins and every matrix job runs the same pytest.
        run: |
          python -m pip install --upgrade pip
          # Base and service layers install separately, exactly as each service
          # Dockerfile does it, so a service pin that supersedes a base pin
          # never becomes a combined ResolutionImpossible.
          pip install -r docker/requirements-base.txt
          pip install -r backend/${{ matrix.service }}/requirements.txt
          pip install -r backend/requirements-test.txt
      - name: pytest
        working-directory: backend/${{ matrix.service }}
        # Services import their own code as `app.*` and the vendored library as
        # `shared.*`, which the images provide by copying both to /app. Outside
        # a container the same two roots have to go on the path explicitly.
        run: PYTHONPATH="$PWD:$PWD/.." pytest app/tests -q

  shared:
    name: "Tests: shared"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements-base.txt -r backend/requirements-test.txt
      - name: pytest
        working-directory: backend
        # Run from backend/, never from backend/shared/: that directory holds a
        # logging.py which would shadow the standard library on sys.path.
        run: PYTHONPATH="$PWD" pytest shared/tests -q

  frontend:
    name: "Tests: frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: vitest
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build

  python-dependency-audit:
    name: Security scan (Python dependencies, report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit each requirements manifest
        # Dependency scans begin report-only so existing findings remain visible
        # without destabilizing CI. The failing step can become blocking once
        # the reported baseline has been triaged.
        continue-on-error: true
        shell: bash
        run: |
          status=0
          while IFS= read -r requirements_file; do
            echo "::group::pip-audit ${requirements_file}"
            python -m pip_audit --requirement "${requirements_file}" || status=1
            echo "::endgroup::"
          done < <(find backend docker -name 'requirements*.txt' -type f | sort)
          exit "${status}"

  frontend-dependency-audit:
    name: Security scan (frontend dependencies, report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit npm lockfile
        # Report high/critical findings now; make this blocking after the
        # existing dependency baseline has been triaged.
        continue-on-error: true
        working-directory: frontend
        run: npm audit --audit-level=high

  guardrails:
    name: Repo guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install pytest
        run: pip install -r backend/requirements-test.txt
      - name: Scan for secrets, stray caches, and compose drift
        run: pytest tests/test_public_repo_guardrails.py -q
