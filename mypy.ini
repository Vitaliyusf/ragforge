[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_ignores = True
check_untyped_defs = True
ignore_missing_imports = True
no_implicit_reexport = True

# Well-typed modules — enforce stricter rules here
[mypy-shared.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-gateway.app.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Services with looser annotation coverage — check bodies only
[mypy-memory.app.*]
check_untyped_defs = True

[mypy-files.app.*]
check_untyped_defs = True

[mypy-rag.app.*]
check_untyped_defs = True

[mypy-llm_agent.app.*]
check_untyped_defs = True

[mypy-embedding.app.*]
check_untyped_defs = True

[mypy-vector_db.app.*]
check_untyped_defs = True
